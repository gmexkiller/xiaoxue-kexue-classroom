<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10252f">
  <meta name="description" content="面向小学科学课堂的交互教学课件与真实实验活动。">
  <title>小学科学交互课堂 · 小胡老师</title>
  <style>
    :root{color-scheme:dark;--bg:#10252f;--panel:#183640;--line:#31535a;--text:#edf7f4;--muted:#abc4c4;--mint:#70ddca;--gold:#ffc371}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#27505a 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.6 "Microsoft YaHei",system-ui,sans-serif}
    main{width:min(980px,calc(100% - 40px));margin:0 auto;padding:9vh 0 48px}.eyebrow{color:var(--mint);font-size:13px;letter-spacing:.12em;font-weight:700}.hero{margin:14px 0 42px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.12;margin:0 0 16px}.hero p{color:var(--muted);max-width:650px;margin:0;font-size:17px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:210px;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,rgba(37,77,85,.9),rgba(22,48,57,.92));text-decoration:none;color:inherit;transition:transform .18s,border-color .18s}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--mint);outline:none}.number{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.08em}.card h2{font-size:23px;margin:12px 0 7px}.card p{color:var(--muted);margin:0 0 22px}.open{margin-top:auto;color:var(--mint);font-weight:700}.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="eyebrow">小学科学 · 交互课堂</div>
      <h1>从真实问题出发，<br>一起观察与发现。</h1>
      <p>面向课堂投影与触摸操作的科学教学课件。数字场景帮助提出问题、展示结构；实验测量与工程测试由学生亲自完成。</p>
    </header>
    <section class="cards" aria-label="课堂课件">
      <a class="card" href="./lessons/%E6%96%9C%E9%9D%A2/output/%E6%96%9C%E9%9D%A2_%E8%83%A1%E6%8B%89%E6%8B%89%E8%AF%BE%E5%A0%82%E7%89%88.html">
        <span class="number">课程 01</span><h2>斜面 · 胡拉拉搬家公司</h2><p>用真实测量数据比较搬运方式，再为货车设计上山路线。</p><span class="open">打开课堂版 →</span>
      </a>
      <a class="card" href="./lessons/%E9%A3%8E%E7%9A%84%E6%88%90%E5%9B%A0/output/%E9%A3%8E%E7%9A%84%E6%88%90%E5%9B%A0_%E5%B0%8F%E8%83%A1%E8%80%81%E5%B8%88%E8%AF%BE%E5%A0%82%E7%89%88.html">
        <span class="number">课程 02</span><h2>风的成因</h2><p>通过可操作的课堂模型观察空气流动与风的形成。</p><span class="open">打开课堂版 →</span>
      </a>
      <a class="card" href="./lessons/%E5%BE%AE%E8%A7%82%E4%B9%8B%E9%97%B4/output/%E5%BE%AE%E8%A7%82%E4%B9%8B%E9%97%B4_%E5%B0%8F%E8%83%A1%E8%80%81%E5%B8%88%E8%AF%BE%E5%A0%82%E7%89%88.html">
        <span class="number">课程 03</span><h2>微观之间</h2><p>在三维显微实验室中观察水中微生物。</p><span class="open">打开课堂版 →</span>
      </a>
    </section>
    <footer class="foot">课件制作：小胡老师 · 本站课件用于小学科学课堂教学。</footer>
  </main>
</body>
</html>
